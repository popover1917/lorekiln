name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public package
        run: |
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/lorekiln/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/lorekiln/hooks/hooks.json >/dev/null
          python -m compileall -q plugins
          python -m unittest discover -s tests -v
      - name: Reject private runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \( -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' -o -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -print)
          if [ -n "$forbidden" ]; then
            echo "Forbidden local or sensitive files found:"
            echo "$forbidden"
            exit 1
          fi
          if git grep -nIE '[A-Za-z]:\\Users\\[^\\]+' -- ':!*.png' ':!*.jpg' ':!*.pdf'; then
            echo 'Windows user-specific absolute path detected.'
            exit 1
          fi
