name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate public package
        run: |
          python -c "import json; json.load(open('.agents/plugins/marketplace.json', encoding='utf-8'))"
          python -c "import json; json.load(open('plugins/lorekiln/.codex-plugin/plugin.json', encoding='utf-8'))"
          python -c "import json; json.load(open('plugins/lorekiln/hooks/hooks.json', encoding='utf-8'))"
          python -m compileall -q plugins tests
          python tests/check_public_package.py
          python -m unittest discover -s tests -v
          python tests/benchmark_lorekiln.py
